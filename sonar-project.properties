# Server URL and credentials belong in SONAR_HOST_URL and SONAR_TOKEN.
sonar.projectKey=Ryther_hapatchy
sonar.organization=ryther
sonar.projectName=HAPatchY
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,.devcontainer/tests/**
sonar.exclusions=.git/**,_test/**,_tmp/**,.venv*/**,.devcontainer/state/**,dist/**,**/__pycache__/**,.scannerwork/**,docs/images/**,custom_components/hapatchy/brand/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13,3.14

# HA awaits these hooks and supplies their positional context even when unused.
# Keep coroutine signatures; never add a dummy await to satisfy static analysis.
# The Docker image tag records the baseline; its digest fixes the actual bytes.
# These criteria suppress only the specified rule in the specified file.
# Review them when hooks or module responsibilities change (see AGENTS.md).
sonar.issue.ignore.multicriteria=ha_remove_async,ha_sensor_async,ha_binary_async,ha_diagnostics_async,ha_sensor_context,ha_binary_context,ha_diagnostics_context,docker_digest,sonar_report_content
sonar.issue.ignore.multicriteria.ha_remove_async.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.ha_remove_async.resourceKey=custom_components/hapatchy/__init__.py
sonar.issue.ignore.multicriteria.ha_sensor_async.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.ha_sensor_async.resourceKey=custom_components/hapatchy/sensor.py
sonar.issue.ignore.multicriteria.ha_binary_async.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.ha_binary_async.resourceKey=custom_components/hapatchy/binary_sensor.py
sonar.issue.ignore.multicriteria.ha_diagnostics_async.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.ha_diagnostics_async.resourceKey=custom_components/hapatchy/diagnostics.py
sonar.issue.ignore.multicriteria.ha_sensor_context.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.ha_sensor_context.resourceKey=custom_components/hapatchy/sensor.py
sonar.issue.ignore.multicriteria.ha_binary_context.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.ha_binary_context.resourceKey=custom_components/hapatchy/binary_sensor.py
sonar.issue.ignore.multicriteria.ha_diagnostics_context.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.ha_diagnostics_context.resourceKey=custom_components/hapatchy/diagnostics.py
sonar.issue.ignore.multicriteria.docker_digest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.docker_digest.resourceKey=.devcontainer/Dockerfile

# S8707 traces Sonar's HTTP response into report.md *content*, not into its
# fixed path. Raw findings are also written as JSON in the same fixed directory.
# Review this exception if the exporter begins accepting a user-chosen path.
sonar.issue.ignore.multicriteria.sonar_report_content.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.sonar_report_content.resourceKey=script/sonar_ci_report.py
