name: Sonar quality
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to scan at its exact commit
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Resolve scan revision
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.revision.outputs.ref }}
    steps:
      - name: Resolve and verify the draft release commit
        id: revision
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$GH_TOKEN"
          details=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
          test "$(jq -r '.isDraft' <<< "$details")" = true
          sha=$(jq -r '.targetCommitish' <<< "$details")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq '.status')
          [[ "$relation" = ahead || "$relation" = identical ]]
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
  coverage:
    name: Sonar coverage
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the verified draft commit
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.ref }}
        run: git checkout --detach "$RELEASE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install locked test environment
        run: python script/install_ci_requirements.py .devcontainer/requirements-tools.txt
      - name: Run coverage on the proposed revision
        run: |
          python -m coverage run --source=custom_components/hapatchy -m pytest -q
          python -m coverage run --append --source=custom_components/hapatchy -m unittest discover -s .devcontainer/tests -v
          python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

  cloud:
    name: Sonar Cloud
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    needs: [resolve, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      report_present: ${{ steps.cloud-artifact.outputs.artifact-id != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the verified draft commit
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.ref }}
        run: git checkout --detach "$RELEASE_SHA"
      - name: Use trusted scanner settings and report exporter
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin '${{ github.event.pull_request.base.sha }}'
          if git cat-file -e FETCH_HEAD:sonar-project.properties 2>/dev/null; then
            rm -f sonar-project.properties
            git show FETCH_HEAD:sonar-project.properties > sonar-project.properties
          fi
          if git cat-file -e FETCH_HEAD:script/sonar_ci_report.py 2>/dev/null; then
            git show FETCH_HEAD:script/sonar_ci_report.py > "$RUNNER_TEMP/sonar_ci_report.py"
          else
            # Bootstrap PR only: the exporter is absent from the base revision.
            # This step has no token; subsequent PRs use the base exporter.
            cp script/sonar_ci_report.py "$RUNNER_TEMP/sonar_ci_report.py"
          fi
      - name: Copy report exporter from main commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: cp script/sonar_ci_report.py "$RUNNER_TEMP/sonar_ci_report.py"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage
      - name: Scan exact revision without executing project code
        id: scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sonar-task"
          chmod 0777 "$RUNNER_TEMP/sonar-task"
          args=('-Dsonar.projectKey=Ryther_hapatchy' '-Dsonar.organization=ryther' '-Dsonar.python.coverage.reportPaths=coverage.xml' '-Dsonar.working.directory=/sonar-task')
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=('-Dsonar.branch.name=main' "-Dsonar.scm.revision=$(git rev-parse HEAD)")
          fi
          if [ -n "$PR_NUMBER" ]; then
            args+=("-Dsonar.pullrequest.key=$PR_NUMBER" "-Dsonar.pullrequest.branch=$PR_HEAD" "-Dsonar.pullrequest.base=$PR_BASE")
          fi
          docker run --rm -w "$GITHUB_WORKSPACE" -e SONAR_USER_HOME=/tmp/sonar-user \
            -e SONAR_TOKEN -e SONAR_HOST_URL=https://sonarcloud.io \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$RUNNER_TEMP/sonar-task:/sonar-task" \
            sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57 \
            "${args[@]}" '-Dsonar.qualitygate.wait=true' 2>&1 | tee "$RUNNER_TEMP/sonar-scanner.log"
      - name: Export complete findings
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          mkdir -p sonar-report
          cp "$RUNNER_TEMP/sonar-scanner.log" sonar-report/scanner.log 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/sonar-task/report-task.txt" ]; then
            args=(--project Ryther_hapatchy)
            if [ -n "$PR_NUMBER" ]; then args+=(--pull-request "$PR_NUMBER"); fi
            python "$RUNNER_TEMP/sonar_ci_report.py" "${args[@]}"
            cat sonar-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Sonar did not submit an analysis; inspect scanner.log.' | tee sonar-report/report.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$SCAN_OUTCOME" != success ]; then exit 1; fi
      - id: cloud-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sonar-cloud-report
          path: sonar-report/
          if-no-files-found: error
          retention-days: 90
      - name: Link complete report
        if: always()
        run: echo "[Download the complete Sonar report](${{ steps.cloud-artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  community:
    name: Sonar Community (external PR)
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      report_present: ${{ steps.community-artifact.outputs.artifact-id != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage
          path: candidate
      - name: Use baseline scanner settings for both revisions
        run: |
          rm -f candidate/sonar-project.properties
          cp baseline/sonar-project.properties candidate/sonar-project.properties
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          candidate = Path("candidate").resolve()
          report = candidate / "coverage.xml"
          document = ElementTree.parse(report)
          sources = document.findall("./sources/source")
          if len(sources) != 1:
              raise ValueError("Expected one coverage source directory")
          sources[0].text = str(candidate)
          document.write(report, encoding="utf-8", xml_declaration=True)
          PY
      - name: Start disposable Sonar Community Build
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          docker run -d --name sonar-local --memory=4g --cpus=2 -p 127.0.0.1:9000:9000 \
            sonarqube@sha256:4905574ab8584dcac1a06c01cdc43a4ce9e369723ac4a7ab1d029c1bf71e6fe9
          # This disposable container's Elasticsearch may inherit a host filesystem
          # with little free percentage despite many free bytes; keep absolute guards.
          for attempt in $(seq 1 60); do
            if docker exec sonar-local curl -fsS -X PUT http://127.0.0.1:9001/_cluster/settings \
                -H 'Content-Type: application/json' \
                -d '{"persistent":{"cluster.routing.allocation.disk.watermark.low":"10gb","cluster.routing.allocation.disk.watermark.high":"5gb","cluster.routing.allocation.disk.watermark.flood_stage":"2gb"}}'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 2
          done
          python baseline/script/sonar_ci_local.py --wait-and-create-projects
      - name: Scan baseline and proposed revision
        id: scan
        continue-on-error: true
        run: python baseline/script/sonar_ci_local.py --scan "$PWD/baseline" "$PWD/candidate"
      - name: Publish full comparison report
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ ! -s sonar-report/report.md ]; then
            echo 'Sonar comparison did not produce a report.' >&2
            exit 1
          fi
          cat sonar-report/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCAN_OUTCOME" != success ]; then
            docker logs sonar-local > sonar-report/server.log 2>&1 || true
            exit 1
          fi
      - id: community-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sonar-community-report
          path: sonar-report/
          if-no-files-found: error
          retention-days: 90
      - name: Link complete report
        if: always()
        run: echo "[Download the complete Sonar report](${{ steps.community-artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  required:
    name: Sonar required
    if: always()
    needs: [coverage, cloud, community]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the expected completed scan and report
        env:
          SONAR_EVENT_NAME: ${{ github.event_name }}
          SONAR_TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
          SONAR_COVERAGE_RESULT: ${{ needs.coverage.result }}
          SONAR_CLOUD_RESULT: ${{ needs.cloud.result }}
          SONAR_COMMUNITY_RESULT: ${{ needs.community.result }}
          SONAR_REPORT_PRESENT: ${{ (needs.cloud.result == 'success' && needs.cloud.outputs.report_present == 'true') || (needs.community.result == 'success' && needs.community.outputs.report_present == 'true') }}
        run: python script/sonar_gate.py
