name: Commit messages
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.12'
      - run: >-
          python -m pip install --only-binary :all: --no-deps
          argcomplete==3.7.2 charset-normalizer==3.5.1 colorama==0.4.6
          commitizen==4.19.0 decli==0.6.3 deprecated==1.3.1
          jinja2==3.1.6 markupsafe==3.0.3 packaging==26.3
          prompt-toolkit==3.0.53 pyyaml==6.0.3 questionary==2.1.1
          termcolor==3.3.0 tomlkit==0.15.1 wcwidth==0.9.1 wrapt==2.4.1
      - name: Check PR title used for squash merge
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$PR_TITLE" --allowed-prefixes
      - name: Check commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            cz check --rev-range "$PR_BASE..HEAD"
          else
            cz check --rev-range HEAD
          fi
