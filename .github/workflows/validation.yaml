name: Integration validation
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate when called by the release workflow
        type: string
        required: false
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate local integration
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace:ro"
          ghcr.io/home-assistant/hassfest@sha256:66b55a8ce14cdcf0c200dd4dab1f3228ac8d3f6e0404ec710a0d8a79b296eba4
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate published repository with HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false
