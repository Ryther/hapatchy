name: Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate when called by the release workflow
        type: string
        required: false
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ux-review:
    name: UX evidence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unfinished UX review and missing revision evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_REF: ${{ inputs.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
        run: |
          if [[ -n "$CANDIDATE_REF" ]]; then
            python script/check_ux_review.py --head "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            python script/check_ux_review.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python script/check_ux_review.py --head "$HEAD_SHA"
          fi
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check GitHub Actions workflows
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history and checked-out files for secrets
        run: |
          image='ghcr.io/gitleaks/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba' # v8.18.4
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" detect --source /repo --redact --no-banner
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" detect --no-git --source /repo --redact --no-banner
  test:
    needs: ux-review
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13.12'
            ha: '2025.3.0'
            typing: '3.13'
            lock: tests/requirements-ha-min.txt
          - python: '3.14.7'
            ha: '2026.9.0'
            typing: '3.14'
            lock: .devcontainer/requirements-tools.txt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked test environment
        run: python -m pip install -r '${{ matrix.lock }}'
      - name: Verify environment
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: |
          python -m pip check
          python -c 'import os, platform, homeassistant.const as c; print(platform.python_version(), c.__version__); assert c.__version__ == os.environ["EXPECTED_HA"]'
      - run: python -m pytest -q
      - run: python -m ruff check custom_components tests .devcontainer/scripts .devcontainer/tests script
      - run: python -m mypy --python-version '${{ matrix.typing }}'
      - run: python -m unittest discover -s .devcontainer/tests -v
      - run: python script/build_release.py
  boot:
    needs: ux-review
    name: HA boot smoke (${{ matrix.ha }} / Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13.12'
            ha: '2025.3.0'
            lock: tests/requirements-ha-min-runtime.txt
          - python: '3.14.7'
            ha: '2026.9.0'
            lock: .devcontainer/requirements-ha.txt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked Home Assistant runtime
        run: python -m pip install -r '${{ matrix.lock }}'
      - name: Verify Home Assistant runtime
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: |
          python -m pip check
          python -c 'import os, platform, homeassistant.const as c; print(platform.python_version(), c.__version__); assert c.__version__ == os.environ["EXPECTED_HA"]'
      - name: Boot HAPatchY in disposable Home Assistant
        run: python script/smoke_ha.py
