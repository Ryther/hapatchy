name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume_tag:
        description: Optional existing draft tag to retry (for example v0.2.0)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: hapatchy-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
      release_id: ${{ steps.candidate.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.12'
      - name: Discover an unfinished draft before making another release PR
        if: inputs.resume_tag == ''
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m script.release_github pending --output "$GITHUB_OUTPUT"
      - name: Require credentials that trigger CI on automated PRs
        if: inputs.resume_tag == '' && steps.pending.outputs.tag == ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Configure RELEASE_PLEASE_TOKEN as described in docs/releasing.md.' >&2
            exit 1
          fi
      - name: Maintain the version PR or create its merged release as a draft
        if: inputs.resume_tag == '' && steps.pending.outputs.tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve the exact draft commit
        if: inputs.resume_tag != '' || steps.pending.outputs.tag != '' || steps.release.outputs.release_created == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_TAG: ${{ inputs.resume_tag }}
          PENDING_TAG: ${{ steps.pending.outputs.tag }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          tag="${RESUME_TAG:-${PENDING_TAG:-$CREATED_TAG}}"
          python -m script.release_github inspect --tag "$tag" --output "$GITHUB_OUTPUT"
  tests:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/tests.yaml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  validation:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/validation.yaml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  publish:
    needs: [prepare, tests, validation]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.12'
      - name: Verify identity, upload archive and checksum, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: >-
          python -m script.release_github publish
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --release-id "$RELEASE_ID"
