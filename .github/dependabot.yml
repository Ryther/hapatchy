version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: homeassistant
      - dependency-name: home-assistant-frontend
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: homeassistant
      - dependency-name: home-assistant-frontend
