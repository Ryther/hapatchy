version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: build(deps)
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    # This is a fully resolved HA/test-plugin lock. Only standalone tools may
    # move alone; update the HA dependency graph as a unit with its baseline.
    allow:
      - dependency-name: commitizen
      - dependency-name: mypy
      - dependency-name: ruff
      - dependency-name: supervisor
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    # The minimum lane is another fully resolved HA/test-plugin lock.
    allow:
      - dependency-name: mypy
      - dependency-name: ruff
      - dependency-name: supervisor
    ignore:
      - dependency-name: homeassistant
      - dependency-name: home-assistant-frontend
      # These are fixed by the HA 2026.7.4 / pytest plugin dependency graph.
      # Revisit them when that baseline or its test plugin changes.
      - dependency-name: bleak
      - dependency-name: pydantic-core
      # HA 2026.7.4 pins aiodns; its Bluetooth manifest pins bleak and adapters.
      - dependency-name: aiodns
      - dependency-name: bluetooth-adapters
      # The 0.13.348 plugin pins these exact test-tool versions.
      - dependency-name: pytest-socket
      - dependency-name: pipdeptree
      # HA 2026.7.4 pins these core dependencies exactly.
      - dependency-name: awesomeversion
      - dependency-name: fnv-hash-fast
