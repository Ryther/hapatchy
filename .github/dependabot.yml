version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: homeassistant
      - dependency-name: home-assistant-frontend
      # These are fixed by the HA 2026.9.0 / pytest plugin dependency graph.
      # Revisit them when that baseline or its test plugin changes.
      - dependency-name: pipdeptree
      - dependency-name: pyOpenSSL
      # pytest-homeassistant-custom-component 0.13.363 pins both exactly.
      - dependency-name: tqdm
      - dependency-name: unidiff
      # HA 2026.9.0 pins SQLAlchemy; its stream integration pins av.
      - dependency-name: SQLAlchemy
      - dependency-name: av
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: homeassistant
      - dependency-name: home-assistant-frontend
      # These are fixed by the HA 2025.3.0 / pytest plugin dependency graph.
      # Revisit them when that baseline or its test plugin changes.
      - dependency-name: bleak
      - dependency-name: pydantic-core
      # HA 2025.3.0 pins aiodns; its bleak pin excludes newer adapters.
      - dependency-name: aiodns
      - dependency-name: bluetooth-adapters
      # HA 2025.3.0 pins these core dependencies exactly.
      - dependency-name: awesomeversion
      - dependency-name: fnv-hash-fast
