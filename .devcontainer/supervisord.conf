[unix_http_server]
file=/tmp/hapatchy-dev/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
pidfile=/tmp/hapatchy-dev/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
childlogdir=/tmp/hapatchy-dev

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/hapatchy-dev/supervisor.sock

[program:ha]
command=%(here)s/../.venv-ha/bin/hass --skip-pip -c %(here)s/state/ha
directory=%(here)s/..
autostart=true
autorestart=false
startsecs=2
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=%(here)s/state/ha/ha.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
